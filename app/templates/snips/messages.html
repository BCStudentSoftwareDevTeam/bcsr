{% with messages = get_flashed_messages(with_categories=true) %}
	  {% if messages %}
	    {% for category, message in messages %}
	      {% set alert_class = category if category in ['success', 'info', 'warning', 'danger'] else 'success' %}
		    <div class="alert alert-{{ alert_class }} alert-dismissible fade in flasher" role="alert">
		      <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">×</span></button>
			    {{message}}
		    </div>
		  {% endfor %}
	  {% endif %}
{% endwith %}
