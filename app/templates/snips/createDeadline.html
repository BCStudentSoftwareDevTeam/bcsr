<!--DEADLINE MANAGEMENT-->
<div class="panel panel-default">
    <div class="panel-heading">
        <h3 class="panel-title">Create a Deadline</h3>
    </div>
    <div class="panel-body">
        <form action="/deadline/create" method="post" id="newDeadline">
            <div class="row">
                <div class="col-sm-8">
                    <div class="form-group">
                        <label for="newDeadlineDescription">Deadline description (required)</label>
                        <textarea placeholder="Enter a deadline description" class="form-control" id="newDeadlineDescription" rows="2" name="deadlineDescription" required></textarea>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="form-group">
                        <label for="datepicker">Deadline date (required)</label>
                        <input type="text" id="datepicker" class="form-control" name="deadlineDate" placeholder="mm/dd/yyyy" aria-describedby="deadlineDateHelp" required>
                        <span id="deadlineDateHelp" class="help-block">Use MM/DD/YYYY.</span>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-default">Create deadline</button>
        </form>
    </div>
</div>
