<!-- DEADLINE MANAGEMENT -->
<div class="panel panel-default">
    <div class="panel-heading">
        <h3 class="panel-title">Create a Deadline</h3>
    </div>
    <div class="panel-body">
        <form action="/deadline/create" method="post" id="newDeadline" class="form-horizontal">
            <div class="form-group col-md-6 col-sm-6" style="padding-right: 20px;">
                <label for="deadlineDescription">Deadline description</label>
                <textarea placeholder="Describe the deadline" class="form-control" id="deadlineDescription" rows="2" name="deadlineDescription" required></textarea>
            </div>
            <div class="form-group col-md-4 col-sm-4" style="padding-right: 20px;">
                <label for="datepicker">Deadline date</label>
                <input type="text" id="datepicker" class="form-control" name="deadlineDate" placeholder="mm/dd/yyyy" required>
            </div>
            <div class="form-group col-md-2 col-sm-2">
                <label class="control-label">&nbsp;</label>
                <input type="submit" class="btn btn-default form-control" value="Add">
            </div>
        </form>
    </div>
</div>
<link rel="stylesheet" href="/static/css/deadline.css" type="text/css" />
