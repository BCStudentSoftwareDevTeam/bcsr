{% extends "/snips/base.html" %}
{% set currentPage ="courseManagement" %}
{% block body %}
<div id="wrapper">
  {% include "sidebar/courseManagementSidebar.html" %}
  <script type="text/javascript" src="/static/js/local/sidebar.js"></script>
  <link rel="stylesheet" href="/static/css/sidebar.css" type="text/css" />
  <div id="page-wrapper">
    {% include "snips/messages.html" %}
    <div class="container-fluid">
<!-- The code above is the header for coursemanagement -->
      <div class="row">
        <div class="panel panel-default">
          <div class="panel-heading">
            <h3 class="panel-title">Find Missing Syllabi</h3>
          </div>
          <div class="panel-body">
            <div class="row">
              <form action="/admin/courseManagement/missingSyllabi" method="POST">
                <div class="col-md-4">
                  <label for="SEID">Select A Semester</label>
                  <select class="form-control" id="SEID" name="SEID" required>
                    <option value>---</option>
                    {% for semester in semesters %}
                    <option value="{{semester.SEID}}">{{semester.term}} {{semester.year}}</option>
                    {% endfor %}
                  </select>
                </div>
                <div class="col-md-2">
                  <input type="submit" class="btn btn-default inputPadding" value="Download">
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
<!-- Close the div heads -->
    </div>
  </div>
</div>
{%endblock%}
