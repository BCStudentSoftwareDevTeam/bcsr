{% with messages = get_flashed_messages() %}
	  {% if messages %}
	    {% for message in messages %}
		    <div class="alert alert-danger alert-dismissible" role="alert">
		      <script>
		        setTimeout(function() {
		          $('.alert').fadeOut('medium');
		        }, 3000);
		      </script>
			    {{message}}
		    </div>
		  {% endfor %}
	  {% endif %}
{% endwith %}
