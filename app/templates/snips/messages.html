<body>
{% with messages = get_flashed_messages() %}
	  {% if messages %}
	    {% for message in messages %}
		    <div class="alert alert-danger alert-dismissible" role="alert">
			{{message}}
		    </div>
		  {% endfor %}
	  {% endif %}
{% endwith %}
<script src="{{ url_for('static', filename='js/local/flashMessages.js') }}"></script>
</body>
