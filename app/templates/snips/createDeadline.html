<!--DEADLINE MANAGEMENT-->
<div class="panel panel-default">
    <div class="panel-heading">
        <h3 class="panel-title">Create a  Deadline</h3>
    </div>
    <div class="panel-body">
        <form action="/deadline/create" method="post" id="newDeadline" class="form-horizontal">
            <div class="form-group col-md-6 col-sm-6" style="padding-right: 20px;">
                <label for="exampleTextarea" class="control-label">Description</label>
                <textarea placeholder="Description" class="form-control" id="exampleTextarea" rows="2" name="deadlineDescription" required></textarea>
            </div>
            <div class="form-group col-md-4 col-sm-4">
                <label for="newDeadlineDate" class="control-label">Date</label>
		        <input type="date" class="form-control" id="newDeadlineDate" name="deadlineDate" required>
            </div>
            <div class="form-group col-md-2 col-sm-2">
                <input type="submit" class="btn btn-default" value="Add">
            </div>
        </form>
    </div>
</div>
<link rel="stylesheet" href="/static/css/deadline.css" type="text/css" />
